[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kv-cache-eval"
version = "0.1.0"
description = "KV Cache optimization technology evaluation workflow skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/kv_cache_eval"]
